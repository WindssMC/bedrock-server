name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Launch Flawless Simulation
      run: |
        echo "Launching official isolated server engines..."
        # 1. Spin up the official Minecraft server engine safely in the background
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest
        
        # 2. Use the open-source web UI container built to instantly expose connection strings without checking secrets
        docker run -d --name playit_tunnel --net=host wisdomsky/playit-docker-web:latest
        
        # 3. Give the cloud network nodes exactly 12 seconds to negotiate a token link
        sleep 12
        
        echo "================================================================="
        echo "                     YOUR FLAWLESS SETUP LINK:                    "
        echo "================================================================="
        # Safely scrapes the alternate log path and dumps the clean text string cleanly onto your screen
        docker logs playit_tunnel | grep -o 'https://playit.gg[^ ]*' || docker logs playit_tunnel | tail -n 25
        echo "================================================================="
