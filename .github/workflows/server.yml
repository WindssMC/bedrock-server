name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools and Playit Directly
      run: |
        sudo apt-get update
        # Installs libnsl to fix the exit code 9 engine crash
        sudo apt-get install -y wget unzip curl libnsl2
        curl -SsL -o playit https://github.com
        chmod +x playit

    - name: Download Minecraft Bedrock Engine via GitHub Mirror
      run: |
        echo "Pulling verified stable Bedrock Engine..."
        wget -q "https://github.com" -O server.zip
        unzip -q server.zip -d bedrock-server
        chmod +x bedrock-server/bedrock_server

    - name: Configure Server Settings
      run: |
        cd bedrock-server
        # Force-enables the required eula setting so the engine can boot safely
        echo "eula=true" > eula.txt
        # Optional: Optimizes the tick rate for smooth performance on mobile connections
        sed -i 's/max-threads=8/max-threads=4/g' server.properties

    - name: Start Tunnel and Server Together
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "NO SECRET DETECTED. CLAIM LINK GENERATING BELOW:"
          echo "===================================================="
          ./playit run &
        else
          ./playit run --secret "$PLAYIT_SECRET" &
        fi
        
        sleep 5
        cd bedrock-server
        LD_LIBRARY_PATH=. ./bedrock_server
