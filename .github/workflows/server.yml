name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create System Blueprint
      run: |
        cat << 'EOF' > docker-compose.yml
        version: "3.8"
        services:
          minecraft:
            image: itzg/minecraft-bedrock-server:latest
            container_name: mc_bedrock
            environment:
              EULA: "TRUE"
            ports:
              - "19132:19132/udp"
            restart: always

          tunnel:
            image: playitcloud/playit:latest
            container_name: playit_tunnel
            network_mode: host
            environment:
              SECRET_KEY: "${PLAYIT_SECRET}"
            restart: always
        EOF

    - name: Launch Blueprint Simulation
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Launch the entire system blueprint safely into the cloud background
        docker compose up -d
        
        # Give the simulated environment 10 seconds to fully warm up and sync
        sleep 10
        
        # Pull down and print the perfect activation link or server diagnostics
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "SIMULATION SUCCESSFUL! GRAB YOUR LINK BELOW:"
          echo "===================================================="
          docker logs playit_tunnel 2>&1 | grep -o 'https://playit.gg[^ ]*' || docker logs playit_tunnel
        else
          echo "===================================================="
          echo "PERFECTION! YOUR SERVER IS LIVE WITH YOUR SECRET KEY"
          echo "===================================================="
          docker logs mc_bedrock
        fi
