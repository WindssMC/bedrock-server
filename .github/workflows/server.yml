name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip curl libnsl2

    - name: Fetch Official Playit Engine
      run: |
        # Pulls the official, raw execution binary cleanly without docker wrappers
        curl -L "https://github.com" -o playit
        chmod +x playit

    - name: Download Stable Bedrock Engine
      run: |
        # Download verified stable community-mirrored engine zip
        wget -q "https://github.com" -O server.zip
        unzip -q server.zip -d bedrock-server
        chmod +x bedrock-server/bedrock_server
        
        # Configure and accept Mojang terms automatically
        cd bedrock-server
        echo "eula=true" > eula.txt

    - name: Force Print Connection Link
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Start the network tunnel directly in the background
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "LAUNCHING UNLINKED MODE..."
          ./playit run &
        else
          ./playit run --secret "$PLAYIT_SECRET" &
        fi
        
        # Keep terminal awake for 15 seconds to let the link print out in plain text
        sleep 15
        
        # Boot up the Minecraft server cleanly
        cd bedrock-server
        LD_LIBRARY_PATH=. ./bedrock_server
