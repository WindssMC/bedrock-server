name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Launch Flawless Simulation
      run: |
        echo "Launching official isolated server engines..."
        # 1. Spin up the official Minecraft server engine safely in the background
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest
        
        # 2. Use the open-source web UI container built to instantly expose connection strings
        docker run -d --name playit_tunnel --net=host wisdomsky/playit-docker-web:latest
        
        # 3. Give the cloud network nodes exactly 15 seconds to negotiate a token link
        sleep 15
        
        echo "================================================================="
        echo "                     YOUR FLAWLESS SETUP LINK:                    "
        echo "================================================================="
        # Dumps the complete raw logs with zero filters so the link is fully visible
        docker logs playit_tunnel
        echo "================================================================="
