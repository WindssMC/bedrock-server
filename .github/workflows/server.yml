name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Playit Manually
      run: |
        # Pulls the correct raw linux binary file from GitHub releases
        curl -fsSL https://github.com -o playit
        chmod +x playit

    - name: Start Tunnel and Docker Minecraft Server
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Start the network tunnel
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "NO PLAYIT SECRET FOUND! LOOK BELOW FOR LINK:"
          echo "===================================================="
          ./playit run &
        else
          ./playit run --secret "$PLAYIT_SECRET" &
        fi
        
        # Give the network tunnel 5 seconds to initiate
        sleep 5
        
        # Pull and launch an ultra-stable, isolated Bedrock Server via Docker container
        docker run -it -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server
