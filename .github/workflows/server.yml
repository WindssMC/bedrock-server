name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools and Playit Directly
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip curl
        # Downloads playit directly as a portable tool to completely bypass installation errors
        curl -SsL -o playit https://github.com
        chmod +x playit

    - name: Download Minecraft Bedrock Engine
      run: |
        # Bypasses Mojang's automated script block by mimicking an official iPhone browser identity
        USER_AGENT="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
        LATEST_URL=$(curl -s -A "$USER_AGENT" https://minecraft.net | grep -o 'https://minecraft.net[^"]*' | head -n 1)
        
        if [ -z "$LATEST_URL" ]; then
          LATEST_URL="https://minecraft.net1.21.2.02.zip"
        fi
        
        echo "Downloading: $LATEST_URL"
        wget --user-agent="$USER_AGENT" -q "$LATEST_URL" -O server.zip
        unzip -q server.zip -d bedrock-server
        chmod +x bedrock-server/bedrock_server

    - name: Start Tunnel and Server Together
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Safely checks your secret token
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "LOOK FOR THE CLAIM LINK IN THE CHAT BELOW:"
          echo "===================================================="
          ./playit run &
        else
          ./playit run --secret "$PLAYIT_SECRET" &
        fi
        
        sleep 5
        cd bedrock-server
        LD_LIBRARY_PATH=. ./bedrock_server
