name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Launch Flawless Simulation
      run: |
        echo "Launching official isolated server engines..."
        # 1. Spin up the official Minecraft server engine safely in the background
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest
        
        # 2. Launch the stable legacy version of Playit that is guaranteed to print the claim link
        docker run -d -t --name playit_tunnel --net=host playitcloud/playit:0.15.26 run
        
        # 3. Give the cloud networks 15 seconds to handshake and generate the authentication link
        sleep 15
        
        echo "================================================================="
        echo "                     YOUR FLAWLESS SETUP LINK:                    "
        echo "================================================================="
        # Pulls the active, raw internal data logs directly onto your main screen
        docker logs playit_tunnel
        echo "================================================================="
