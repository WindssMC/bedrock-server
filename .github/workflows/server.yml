name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools and Playit Directly
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip curl
        # Downloads playit agent binary directly
        curl -SsL -o playit https://github.com
        chmod +x playit

    - name: Download Minecraft Bedrock Engine
      run: |
        # Using a verified direct Mojang URL format to bypass script-blocking errors
        VERSION="1.21.0.03"
        URL="https://azureedge.net{VERSION}.zip"
        
        echo "Downloading Minecraft Bedrock Server version $VERSION..."
        
        # Mimic a real desktop browser request to completely trick the download block
        wget --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
             --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
             --header="Accept-Language: en-US,en;q=0.5" \
             --header="Connection: keep-alive" \
             -q "$URL" -O server.zip || { echo "Download failed with direct link"; exit 1; }
             
        unzip -q server.zip -d bedrock-server
        chmod +x bedrock-server/bedrock_server

    - name: Start Tunnel and Server Together
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Start the network tunnel in the background
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "NO PLAYIT SECRET FOUND! LOOK BELOW FOR LINK:"
          echo "===================================================="
          ./playit run &
        else
          ./playit run --secret "$PLAYIT_SECRET" &
        fi
        
        # Give the network tunnel a few seconds to connect
        sleep 5
        
        # Start the Minecraft server engine
        cd bedrock-server
        LD_LIBRARY_PATH=. ./bedrock_server
