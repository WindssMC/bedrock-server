name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Flawless Simulation Containers
      run: |
        echo "Initializing isolated virtual environments..."
        # Launch official Minecraft engine smoothly in the background
        docker run -d --name minecraft_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest
        
        # Bypasses the broken repository secrets completely to force a brand new link generation
        docker run -d --name playit_agent --net=host playitcloud/playit:latest run
        
        # Give the master network nodes exactly 15 seconds to negotiate a token link
        sleep 15
        
        echo "================================================================="
        echo "                     YOUR FLAWLESS SETUP LINK:                    "
        echo "================================================================="
        # Scrapes the background container stream and prints the text out cleanly
        docker logs playit_agent 2>&1 | grep -o 'https://playit.gg[^ ]*' || docker logs playit_agent | tail -n 20
        echo "================================================================="
