name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    - name: Install Tools and Playit Directly
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl
        # Install the bedrock server tool globally via npm
        sudo npm install -g bds-core --unsafe-perm
        
        # Pull portable playit agent binary directly
        curl -SsL -o playit https://github.com
        chmod +x playit

    - name: Start Tunnel and Server Together
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Safely execute the tunnel daemon in background
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "NO SECRET DETECTED. CLAIM LINK GENERATING BELOW:"
          echo "===================================================="
          ./playit run &
        else
          ./playit run --secret "$PLAYIT_SECRET" &
        fi
        
        # Keep background runner steady
        sleep 5
        
        # Launch the Bedrock server using bds-core engine launcher
        bds-core --eula true --version latest
