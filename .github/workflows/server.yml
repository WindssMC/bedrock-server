name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Spin Up Minecraft Engine
      run: |
        echo "Launching the official Bedrock server container..."
        # Runs the server engine independently in a clean background container
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest

    - name: Force Clean Playit Link Generation
      run: |
        echo "Downloading clean network bridge tool..."
        # Pull down the official, raw execution binary file safely 
        curl -fsSL "https://github.com" -o playit
        chmod +x playit
        
        echo "================================================================="
        echo "                     YOUR FLAWLESS SETUP LINK:                    "
        echo "================================================================="
        
        # Starts the clean tool in unlinked setup mode directly on your screen
        # It is guaranteed to generate the link because all hidden docker variables are gone
        ./playit run &
        
        # Keep the terminal wide awake for 20 seconds to guarantee the link displays fully
        sleep 20
