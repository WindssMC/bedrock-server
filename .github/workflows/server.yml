name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Launch Flawless Simulation
      run: |
        echo "Launching official isolated server engines..."
        # 1. Spin up the official Minecraft server engine safely in the background
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest
        
        # 2. Force playit into 'setup' mode so it generates a claim URL without checking for secrets
        docker run -d -t --name playit_tunnel --net=host playitcloud/playit:latest setup
        
        echo "================================================================="
        echo "                WAITING FOR SETUP LINK TO GENERATE...             "
        echo "================================================================="
        
        # 3. Give the network bridge exactly 15 seconds to safely print the token line
        sleep 15
        
        echo "SUCCESS! YOUR FLAWLESS SETUP LINK IS RIGHT HERE:"
        echo "-----------------------------------------------------------------"
        # Dumps the clean log straight to your screen
        docker logs playit_tunnel
        echo "-----------------------------------------------------------------"
