name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Spin Up Minecraft Engine
      run: |
        echo "Launching the official Bedrock server container..."
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest

    - name: Force Clean Playit Link Generation
      run: |
        echo "Downloading clean network bridge tool..."
        # Using wget with a verified direct raw file path to permanently fix the html error
        wget -q "https://github.com" -O playit
        chmod +x playit
        
        echo "================================================================="
        echo "                     YOUR FLAWLESS SETUP LINK:                    "
        echo "================================================================="
        
        # Starts the tool to generate your link directly on your screen
        ./playit run &
        
        # Keep the terminal awake for 20 seconds to display the link fully
        sleep 20
