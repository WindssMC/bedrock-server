name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Playit Binary Directly
      run: |
        # Download the official pre-compiled Linux binary directly from Playit's source releases
        curl -L "https://github.com" -o playit
        chmod +x playit

    - name: Start Docker Server and Tunnel
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Launch the official Bedrock engine inside an isolated background container
        docker run -d -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server
        
        # Give the background system a few moments to spin up cleanly
        sleep 5
        
        # Initialize the network tunnel route
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "NO PLAYIT SECRET DETECTED. CHOOSE THE LINK BELOW:"
          echo "===================================================="
          ./playit run
        else
          ./playit run --secret "$PLAYIT_SECRET"
        fi
