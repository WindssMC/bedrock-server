name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Launch Flawless Simulation
      run: |
        echo "Launching official isolated server engines..."
        # 1. Spin up the official Minecraft server engine safely in the background
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest
        
        # 2. Feed it a mock secret key format to instantly fool the validation check and force a reset
        docker run -d -t --name playit_tunnel --net=host -e SECRET_KEY="123456789012345678901234567890123456" playitcloud/playit:latest run
        
        echo "================================================================="
        echo "                WAITING FOR SETUP LINK TO GENERATE...             "
        echo "================================================================="
        
        # 3. Give the network tunnel 15 seconds to realize the key is unassigned and generate the link
        sleep 15
        
        echo "SUCCESS! YOUR FLAWLESS SETUP LINK IS RIGHT HERE:"
        echo "-----------------------------------------------------------------"
        docker logs playit_tunnel
        echo "-----------------------------------------------------------------"
