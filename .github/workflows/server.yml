name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools and Playit Directly
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip curl
        # Downloads portable playit agent directly
        curl -SsL -o playit https://github.com
        chmod +x playit

    - name: Download Minecraft Bedrock Engine via GitHub Mirror
      run: |
        echo "Pulling verified stable Bedrock Engine..."
        # Bypasses Mojang's servers entirely using a reliable open-source community mirror archive
        wget -q "https://github.com" -O server.zip || { echo "Mirror download failed"; exit 1; }
        
        unzip -q server.zip -d bedrock-server
        chmod +x bedrock-server/bedrock_server

    - name: Start Tunnel and Server Together
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        # Safely execute the tunnel daemon in background
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "NO SECRET DETECTED. CLAIM LINK GENERATING BELOW:"
          echo "===================================================="
          ./playit run &
        else
          ./playit run --secret "$PLAYIT_SECRET" &
        fi
        
        # Keep background runner steady
        sleep 5
        
        cd bedrock-server
        LD_LIBRARY_PATH=. ./bedrock_server
