name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create System Blueprint
      run: |
        cat << 'EOF' > docker-compose.yml
        version: "3.8"
        services:
          minecraft:
            image: itzg/minecraft-bedrock-server:latest
            container_name: mc_bedrock
            environment:
              EULA: "TRUE"
            ports:
              - "19132:19132/udp"
            restart: always

          tunnel:
            image: playitcloud/playit:latest
            container_name: playit_tunnel
            network_mode: host
            # Forces playit to run the setup setup loop directly inside docker logs
            command: run
            restart: always
        EOF

    - name: Launch Blueprint Simulation
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        docker compose up -d
        
        # Give it 12 seconds to fully handshake with playit's main master servers
        sleep 12
        
        echo "===================================================="
        echo "PERFECTION ACCESSED! LOOK BELOW FOR YOUR CLAIM LINK:"
        echo "===================================================="
        docker logs playit_tunnel
