name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Launch Flawless Simulation
      run: |
        echo "Launching official isolated server engines..."
        # 1. Spin up the official Minecraft server engine safely in the background
        docker run -d --name mc_engine -e EULA=TRUE -p 19132:19132/udp itzg/minecraft-bedrock-server:latest
        
        # 2. Launch the official playit container with a simulated interactive interface flag
        docker run -d -t --name playit_tunnel --net=host playitcloud/playit:latest run
        
        echo "================================================================="
        echo "                WAITING FOR SETUP LINK TO GENERATE...             "
        echo "================================================================="
        
        # 3. Aggressive loop that checks the internal terminal output every 2 seconds for your claim string
        for i in {1..30}; do
          LINK=$(docker logs playit_tunnel 2>&1 | grep -o 'https://playit.gg[^ ]*' | head -n 1)
          if [ ! -z "$LINK" ]; then
            echo ""
            echo "SUCCESS! YOUR FLAWLESS SETUP LINK IS RIGHT HERE:"
            echo "-----------------------------------------------------------------"
            echo "$LINK"
            echo "-----------------------------------------------------------------"
            break
          fi
          echo -n "."
          sleep 2
        done
        
        # Safety fallback print if the loop hits a timing delay
        if [ -z "$LINK" ]; then
          echo "Full system diagnostics output:"
          docker logs playit_tunnel
        fi
