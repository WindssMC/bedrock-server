name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create System Blueprint
      run: |
        cat << 'EOF' > docker-compose.yml
        version: "3.8"
        services:
          minecraft:
            image: itzg/minecraft-bedrock-server:latest
            container_name: mc_bedrock
            environment:
              EULA: "TRUE"
            ports:
              - "19132:19132/udp"
            restart: always

          tunnel:
            image: playitcloud/playit:latest
            container_name: playit_tunnel
            network_mode: host
            # Forces playit to spit out raw network link updates continuously
            command: run
            restart: always
        EOF

    - name: Launch Blueprint Simulation
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        docker compose up -d
        
        # Give the master servers a full 20 seconds to establish the link route
        sleep 20
        
        echo "===================================================="
        echo "PERFECTION VISIBLE! LOOK BELOW FOR YOUR ENTIRE LINK:"
        echo "===================================================="
        
        # Pulls the active, raw internal data logs directly to bypass display omissions
        docker logs --tail 50 playit_tunnel
