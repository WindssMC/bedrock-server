name: Custom Bedrock Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Network and Zip Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip curl jq

    - name: Download and Install Playit.gg
      run: |
        curl -SsL https://github.io | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg > /dev/null
        echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://github.io ./ " | sudo tee /etc/apt/sources.list.d/playit.list
        sudo apt-get update
        sudo apt-get install playit -y

    - name: Download Latest Minecraft Bedrock Engine
      run: |
        # Automatically fetch the literal newest version URL directly from Mojang to match your iPhone app
        USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
        LATEST_URL=$(curl -s -A "$USER_AGENT" https://www.minecraft.net/en-us/download/server/bedrock | grep -o 'https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-[^"]*' | head -n 1)
        if [ -z "$LATEST_URL" ]; then
          LATEST_URL="https://minecraft.net"
        fi
        echo "Downloading from: $LATEST_URL"
        wget -q "$LATEST_URL" -O server.zip
        unzip -q server.zip -d bedrock-server
        chmod +x bedrock-server/bedrock_server

    - name: Start Tunnel and Server Together
      env:
        PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      run: |
        cd bedrock-server
        
        # Safe-check fallback if you ever clear or lose your secret
        if [ -z "$PLAYIT_SECRET" ]; then
          echo "===================================================="
          echo "NO SECRET FOUND! LOOK BELOW FOR THE CLAIM LINK:"
          echo "===================================================="
          playit run &
        else
          playit run --secret "$PLAYIT_SECRET" &
        fi
        
        # Give the network tunnel 5 seconds to warm up before launching the engine
        sleep 5
        LD_LIBRARY_PATH=. ./bedrock_server
